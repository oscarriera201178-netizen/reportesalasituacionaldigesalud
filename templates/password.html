{% extends "base.html" %}
{% block title %}Cambiar contraseña · DIGESALUD-MPPD{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Cambiar contraseña</h1>
  {% if mandatory %}<p class="notice notice-info">Debes cambiar la contraseña temporal para continuar.</p>{% endif %}
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Contraseña actual
      <input name="current_password" type="password" autocomplete="current-password" required maxlength="128">
    </label>
    <label>Nueva contraseña
      <input name="new_password" type="password" autocomplete="new-password" required minlength="12" maxlength="128">
    </label>
    <label>Confirmar nueva contraseña
      <input name="confirmation" type="password" autocomplete="new-password" required minlength="12" maxlength="128">
    </label>
    <button class="button button-primary" type="submit">Cambiar contraseña</button>
  </form>
</section>
{% endblock %}
